name: Build image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-dev" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kicad-pocs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag kicad-pocs:ci "${{ steps.img.outputs.name }}:latest"
          docker push "${{ steps.img.outputs.name }}:latest"
